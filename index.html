<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shoal Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght,SOFT,WONK@9..144,400,0,1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stage">
    <aside class="notes" id="notes"></aside>
    <div class="phone-wrap" id="phoneWrap">
      <div class="phone" id="phone">
        <div class="glow" aria-hidden="true">
          <img class="glow-top" src="assets/glow-top.svg" alt="">
          <img class="glow-bottom" src="assets/glow-bottom.svg" alt="">
        </div>
        <div class="statusbar" aria-hidden="true">
          <span class="time">9:41</span>
          <img src="assets/status.svg" alt="">
        </div>
        <main id="screen" class="screen"></main>
        <div id="sheet" class="sheet-layer"></div>
        <div id="toast" class="toast" role="status"></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
  <script src="main-app.js"></script>
</body>
</html>
